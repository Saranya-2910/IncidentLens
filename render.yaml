# Render Blueprint configured for 100% Free Tier
# (Render Free Web Service + External Supabase PostgreSQL + Vercel Free Frontend)
# Zero paid disks, zero paid workers, zero paid managed databases/Redis required.

services:
  - type: web
    name: incidentlens-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: TASK_DISPATCH_MODE
        value: inline
      - key: REDIS_URL
        value: memory://
      - key: CELERY_BROKER_URL
        value: memory://
      - key: CELERY_RESULT_BACKEND
        value: cache+memory://
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SYNC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: EMBEDDING_MODEL
        value: text-embedding-004
      - key: EVENT_RETENTION_DAYS
        value: "30"
